name: Build iOS (unsigned IPA)

# Run on every push to main + on demand (workflow_dispatch)
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # ----- 项目详细 -----
  GODOT_VERSION: 4.6.1-stable # Godot版本
  IOS_PRESET:    iOS
  NAME:          ${{ github.event.repository.name }}
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    # 0. 拉取仓库
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true 

    # 1. 下载 headless Godot 编辑器
    - name: Download Godot headless
      run: |
        curl -L \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" \
          -o godot.zip
        unzip -q godot.zip -d godot
        
    # 2. 下载并安装 iOS 导出模板（从官方源自动获取）
    - name: Download and install iOS export template
      run: |
        TEMPLATE_VERSION=$(echo "${{ env.GODOT_VERSION }}" | sed 's/-/./')
        # 下载官方导出模板包（包含所有平台）
        curl -L \
          "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz" \
          -o templates.tpz
        # 解压到临时目录
        unzip -q templates.tpz -d templates_temp
        # 创建 Godot 模板目录
        templates_root="$HOME/Library/Application Support/Godot/export_templates"
        mkdir -p "$templates_root/${TEMPLATE_VERSION}"
        # 复制 iOS 模板到正确位置
        cp templates_temp/templates/ios.zip "$templates_root/${TEMPLATE_VERSION}/ios.zip"
        # 清理临时文件
        rm -rf templates.tpz templates_temp

    # 3. 导出预设 → Xcode 项目
    #    注意：需要在导出预设的“高级选项”中启用 `application/export_project_only=true` 和 `application/delete_old_export_files_unconditionally=true`
    - name: Export to Xcode project
      run: |
        mkdir -p build/ios
        godot/Godot.app/Contents/MacOS/Godot --headless --path . \
          --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

    # 4. 构建未签名的 archive
    - name: xcodebuild archive (unsigned)
      run: |
        xcodebuild archive \
          -project build/ios/${NAME}.xcodeproj \
          -scheme "${NAME}" \
          -archivePath build/ios/App.xcarchive \
          -configuration Release \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          | xcpretty

    # 5. 打包为 .ipa
    - name: Package IPA
      run: |
        cd build/ios
        mkdir -p Payload
        cp -R App.xcarchive/Products/Applications/*.app Payload/
        zip -r "${NAME}.ipa" Payload
        mv "${NAME}.ipa" ../../

    # 6. 上传构建产物
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: ${{ env.NAME }}.ipa

        retention-days: 14
