name: Build macOS (unsigned)

# 每次 push 自动构建 + 可手动触发
on:
  push:
    branches:
      - ee
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.1
  EXPORT_NAME: mfmp
  PROJECT_PATH: .

jobs:
  build-macos:
    runs-on: ubuntu-24.04
    # 与 Windows/Android 同一套技术栈：现成的 Godot 4.6.1 + 全平台导出模板
    container:
      image: barichello/godot-ci:4.6.1
    name: Export macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # macOS 预设里原本是 codesign=3(自动签名) + distribution_type=1(App Store 类型)，
      # CI 没有证书，必须关掉签名并改回普通 .app。
      # 注意：这里只改 runner 内存里的副本，不会动你本地文件。
      - name: Disable codesign for CI build
        run: |
          sed -i 's/^codesign\/codesign=3/codesign\/codesign=0/' export_presets.cfg
          sed -i 's/^export\/distribution_type=1/export\/distribution_type=0/' export_presets.cfg
          echo "=== 验证 sed 后的关键选项 ==="
          grep -E "codesign/codesign|export/distribution_type" export_presets.cfg

      - name: Project Import
        run: |
          cd $PROJECT_PATH
          godot --headless --verbose --import

      - name: macOS Build (unsigned .app)
        run: |
          mkdir -p build/mac
          # 命令行路径覆盖掉预设里那个坏的 ../../mfmp_NacOS_test.dmg
          godot --headless --verbose --export-release "macOS" "build/mac/${EXPORT_NAME}.app"

      - name: Package zip
        run: |
          cd build/mac
          command -v zip >/dev/null 2>&1 || (apt-get update -qq && apt-get install -y -qq zip)
          zip -r "../${EXPORT_NAME}-macos.zip" "${EXPORT_NAME}.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfmp-macos
          path: build/${{ env.EXPORT_NAME }}-macos.zip
          retention-days: 14
