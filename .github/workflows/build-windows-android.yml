name: Export binaries

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.1
  EXPORT_NAME: mfmp
  PROJECT_PATH: .

jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows
          export_template: "Windows Desktop"
          ext: "exe"
        - name: Android
          export_template: "Android"
          ext: "apk"
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.1
    name: Export ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          echo "$KEYSTORE" | base64 -d > /root/debug.keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Project Import
        run: |
          cd $PROJECT_PATH
          godot --headless --verbose --import

      - name: ${{ matrix.name }} Build
        run: |
          mkdir -v -p "build/${{ matrix.name }}"
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "${{ matrix.export_template }}" "${EXPORT_DIR}/${{ matrix.name }}/${EXPORT_NAME}.${{ matrix.ext }}"
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: "/root/debug.keystore"
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfmp-${{ matrix.name }}
          path: build/${{ matrix.name }}