name: Build and Release

# ── 分支模型 ──────────────────────────────────────────────────────────
#   push dev    -> 只构建。产物在 Actions 的 artifact 里（可下载，默认保留 90 天），
#                  不产生 Release。日常开发推这里。
#   push master -> 构建 + 自动 Release。tag 按北京时间日期生成（v2026.11.18），
#                  同一天第二次会变成 v2026.11.18-2。
#   push v*     -> 构建 + 发布到指定 tag（补历史版本 / 手动发版）
#   手动运行    -> 填 release_tag 发到那个 tag；留空则按当前分支规则
#
# ── 为什么三个平台放在同一个文件里 ──────────────────────────────────
#   Release 的 tag 是运行时算出来的（日期 + 撞名递增）。如果 Windows/Android
#   和 iOS 分成两个 workflow，两边各自算 tag，几分钟窗口内会算出同一个日期 tag，
#   然后互相覆盖附件。合并成一个文件后只有一个 job 建 Release，tag 只算一次。
#
# ── 为什么用 --export-debug 而不是 --export-release ──────────────────
#   Godot 的 Windows 导出里，控制台版（<名字>.console.exe）由预设项
#   debug/export_console_wrapper 控制，默认值是 1 = "Debug Only"，
#   源码里写的是：copy_wrapper = (mode == 1 && p_debug) || (mode == 2)。
#   也就是说用 --export-release 时 p_debug 是 false，console.exe 根本不会生成。
#   本地导出的包是 96.0MB，正好等于 windows_debug_x86_64.exe；
#   release 模板是 99.7MB，所以之前 CI 出来的包和本地根本不是一回事。
#   用 --export-debug 之后，三端都与本地导出一致，Windows 也带上 console.exe。
#
# ── 为什么 Windows 导出成 .zip ──────────────────────────────────────
#   导出路径以 zip 结尾时，Godot 会先导进临时目录，再把整个目录（exe、pck、
#   console.exe，以及按需拷的 dll）打成压缩包，路径由项目名决定。
#   这样 Release 上是一个可直接解压运行的文件夹，而不是散装的 exe 和 pck。
# ─────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [dev, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '手动指定 release tag（留空则按当前分支规则）'
        required: false
        default: ''

# 建 Release / 传附件需要写权限。GITHUB_TOKEN 默认只读，必须显式声明。
permissions:
  contents: write

env:
  GODOT_VERSION: 4.6.1

# 同一个 ref 上的运行串行化，避免两次 push 的 Release 互相覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Windows + Android：矩阵构建，两个平台并行 ──────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Windows
          export_template: "Windows Desktop"
          # 以 zip 结尾，Godot 会把 exe / pck / console.exe 一起打包
          export_path: "mfmp.zip"
        - name: Android
          export_template: "Android"
          export_path: "mfmp.apk"
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.1
    name: Export ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      # 容器里 Godot 装在 /root，步骤却以普通用户跑，要把配置挪到 ~ 下；
      # 顺便把仓库 Secret 里的 base64 keystore 解码成签名文件。
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          echo "$KEYSTORE" | base64 -d > /root/debug.keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}

      # 先让 Godot 扫一遍资源，否则导出会找不到文件
      - name: Project Import
        run: godot --headless --verbose --import

      - name: ${{ matrix.name }} Build
        run: |
          mkdir -v -p "build/${{ matrix.name }}"
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-debug "${{ matrix.export_template }}" "${EXPORT_DIR}/${{ matrix.name }}/${{ matrix.export_path }}"
        env:
          # debug 导出读的是 DEBUG_* 这组变量；RELEASE_* 一并给出，
          # 以后若要切回 --export-release 不用再改这里。
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: "/root/debug.keystore"
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: "/root/debug.keystore"
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # 把产物内容打进日志，方便确认 zip 里确实有 console.exe
      - name: Show build output
        run: |
          ls -lh "build/${{ matrix.name }}"
          ZIP="build/${{ matrix.name }}/mfmp.zip"
          if [ -f "$ZIP" ]; then
            echo "--- mfmp.zip 内容 ---"
            unzip -l "$ZIP"
          fi

      # job 之间不共享文件系统，产物要经 artifact 中转
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfmp-${{ matrix.name }}
          path: build/${{ matrix.name }}

  # ── iOS：必须跑 macOS runner，步骤与其他平台完全不同 ──────────────
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    name: Export iOS
    env:
      IOS_PRESET: iOS
      NAME: ${{ github.event.repository.name }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      GODOT_VERSION: 4.6.1-stable
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Download Godot headless
        run: |
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" \
            -o godot.zip
          unzip -q godot.zip -d godot

      - name: Download and install iOS export template
        run: |
          TEMPLATE_VERSION=$(echo "${{ env.GODOT_VERSION }}" | sed 's/-/./')
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz" \
            -o templates.tpz
          unzip -q templates.tpz -d templates_temp
          templates_root="$HOME/Library/Application Support/Godot/export_templates"
          mkdir -p "$templates_root/${TEMPLATE_VERSION}"
          cp templates_temp/templates/ios.zip "$templates_root/${TEMPLATE_VERSION}/ios.zip"
          rm -rf templates.tpz templates_temp

      # 需要在导出预设的高级选项里启用 application/export_project_only
      - name: Export to Xcode project
        run: |
          mkdir -p build/ios
          godot/Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-debug "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

      - name: xcodebuild archive (unsigned)
        run: |
          xcodebuild archive \
            -project build/ios/${NAME}.xcodeproj \
            -scheme "${NAME}" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "mfmp.ipa" Payload
          mv "mfmp.ipa" ../../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfmp-iOS
          path: mfmp.ipa
          retention-days: 14

  # ── 发布：唯一负责建 Release 的地方 ──────────────────────────────
  # 单独一个 job 是必须的。若放进矩阵，两个平台会并发建同一个 tag 的 Release，
  # 第二个要么撞 conflict，要么把第一个刚上传的附件覆盖掉。
  release:
    needs: [build, build-ios]
    runs-on: ubuntu-24.04
    # dev 分支的 push 跳过发布；tag / master / 手动运行才走到这里
    if: |
      !cancelled()
      && needs.build.result == 'success'
      && (github.ref_type == 'tag' || github.ref_name == 'master' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Inspect
        run: ls -lh dist

      # 决定发到哪个 tag：手动填的 > 当前 tag > 按日期自动生成
      - name: Resolve tag
        id: meta
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            echo "tag=$RELEASE_TAG_INPUT" >> "$GITHUB_OUTPUT"
            echo "reason=手动指定" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "reason=推送 tag" >> "$GITHUB_OUTPUT"
          else
            # master push：按北京时间取日期；同一天已有同名 tag 就加 -2 -3 …
            base="v$(TZ=Asia/Shanghai date +%Y.%m.%d)"
            tag="$base"
            n=1
            while [ $n -le 20 ]; do
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag")
              [ "$code" != "200" ] && break
              n=$((n + 1))
              tag="$base-$n"
            done
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "reason=master 推送" >> "$GITHUB_OUTPUT"
          fi

      # 附件名带版本号，玩家下载后不用再猜是哪个版本
      - name: Rename assets
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p out
          for f in dist/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            case "$b" in
              *.zip)   cp "$f" "out/${TAG}-windows.zip" ;;
              *.apk)   cp "$f" "out/${TAG}-android.apk" ;;
              *.idsig) cp "$f" "out/${TAG}-android.apk.idsig" ;;
              *.ipa)   cp "$f" "out/${TAG}-ios.ipa" ;;
              *)       cp "$f" "out/${TAG}-${b}" ;;
            esac
          done
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          overwrite_files: true
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 已发布 ${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 触发原因：${{ steps.meta.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交：${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
